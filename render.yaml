services:
  - type: web
    name: herald-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate_safe && python manage.py seed_data --traceback"
    startCommand: "gunicorn herald_backend.wsgi:application --worker-class gthread --workers ${WEB_CONCURRENCY:-2} --threads ${GUNICORN_THREADS:-4} --timeout 120 --keep-alive 5"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: herald-backend-6i3m.onrender.com
      - key: RENDER
        value: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: GUNICORN_THREADS
        value: 4
      - key: DEFAULT_CACHE_TIMEOUT
        value: 60
      - key: DB_CONN_MAX_AGE
        value: 600
